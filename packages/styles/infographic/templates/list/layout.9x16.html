<div class="region list">
  <h2 class="list-title" data-qa="title">{{fit title w=864 h=206 max=92 min=62 lh=1.12 font=display lines=2}}</h2>
  <ol class="items">{{#each items}}
    <li class="item" data-qa="item"><span class="bullet" style="width:99px">{{@num}}</span><span class="item-text">{{fit item w=737 h=155 max=62 min=46 lh=1.25 font=body lines=2 group=items}}</span></li>{{/each}}
  </ol>
</div>
