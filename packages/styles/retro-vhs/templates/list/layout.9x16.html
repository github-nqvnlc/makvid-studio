<div class="region list">
  <h2 class="list-title" data-qa="title">{{fit title w=864 h=242 max=108 min=74 lh=1.12 font=display lines=2}}</h2>
  <ol class="items">{{#each items}}
    <li class="item" data-qa="item"><span class="bullet" style="width:118px">{{@num}}</span><span class="item-text">{{fit item w=718 h=152 max=74 min=56 lh=1.25 font=body lines=2 group=items}}</span></li>{{/each}}
  </ol>
</div>
