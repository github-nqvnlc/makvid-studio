<div class="region cta">
  <div class="slide-head" aria-hidden="true"><span class="sh-bar"></span><span class="sh-dots"><i></i><i></i><i></i></span></div>
  <div class="deco" aria-hidden="true"></div>
  <h1 class="cta-head" data-qa="headline">{{fit headline w=826 h=385 max=100 min=55 lh=1.08 font=display lines=3}}</h1>
  <div class="cta-btn" data-qa="action">{{fit action w=780 h=70 max=54 min=30 lh=1.15 font=display lines=1}}</div>
  {{#if handle}}<div class="cta-handle" data-qa="handle">{{fit handle w=872 h=56 max=40 min=26 lh=1.15 font=body lines=1}}</div>{{/if}}
</div>
