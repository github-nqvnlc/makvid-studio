<div class="region quote">
  <div class="slide-head" aria-hidden="true"><span class="sh-bar"></span><span class="sh-dots"><i></i><i></i><i></i></span></div>
  <div class="qmark" aria-hidden="true">“</div>
  <blockquote class="q-text" data-qa="quote">{{fit quote w=854 h=409 max=74 min=36 lh=1.2 font=display lines=6}}</blockquote>
  {{#if author}}<div class="q-author" data-qa="author">{{fit author w=882 h=50 max=36 min=24 lh=1.15 font=body lines=1}}</div>{{/if}}
</div>
