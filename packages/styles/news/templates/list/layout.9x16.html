<div class="region list">
  <div class="ticker" aria-hidden="true"><span class="tk-label">TIN NHANH</span><span class="tk-track"><span class="tk-run">{{text title}} • {{text title}} • {{text title}} • </span></span></div>
  <h2 class="list-title" data-qa="title">{{fit title w=864 h=211 max=94 min=62 lh=1.12 font=display lines=2}}</h2>
  <ol class="items">{{#each items}}
    <li class="item" data-qa="item"><span class="bullet" style="width:99px">{{@num}}</span><span class="item-text">{{fit item w=737 h=141 max=62 min=46 lh=1.25 font=body lines=2 group=items}}</span></li>{{/each}}
  </ol>
</div>
