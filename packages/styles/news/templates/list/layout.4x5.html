<div class="region list">
  <div class="ticker" aria-hidden="true"><span class="tk-label">TIN NHANH</span><span class="tk-track"><span class="tk-run">{{text title}} • {{text title}} • {{text title}} • </span></span></div>
  <h2 class="list-title" data-qa="title">{{fit title w=918 h=188 max=84 min=56 lh=1.12 font=display lines=2}}</h2>
  <ol class="items">{{#each items}}
    <li class="item" data-qa="item"><span class="bullet" style="width:90px">{{@num}}</span><span class="item-text">{{fit item w=800 h=102 max=56 min=39 lh=1.25 font=body lines=2 group=items}}</span></li>{{/each}}
  </ol>
</div>
