<div class="region list">
  <h2 class="list-title" data-qa="title">{{fit title w=864 h=215 max=96 min=60 lh=1.12 font=display lines=2}}</h2>
  <ol class="items">{{#each items}}
    <li class="item" data-qa="item"><span class="bullet" style="width:96px">{{@num}}</span><span class="item-text">{{fit item w=740 h=150 max=60 min=46 lh=1.25 font=body lines=2 group=items}}</span></li>{{/each}}
  </ol>
</div>
