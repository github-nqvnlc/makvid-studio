<div class="region quote">
  <div class="qmark" aria-hidden="true">“</div>
  <blockquote class="q-text" data-qa="quote">
    {{fit quote w=854 h=448 max=72 min=36 lh=1.2 font=display lines=6}}
  </blockquote>
  {{#if author}}
  <div class="q-author" data-qa="author">
    {{fit author w=882 h=50 max=36 min=24 lh=1.15 font=body lines=1}}
  </div>
  {{/if}}
</div>
