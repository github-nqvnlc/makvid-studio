<div class="region quote">
  <div class="qmark" aria-hidden="true">“</div>
  <blockquote class="q-text" data-qa="quote">
    {{fit quote w=795 h=686 max=90 min=47 lh=1.2 font=display lines=6}}
  </blockquote>
  {{#if author}}
  <div class="q-author" data-qa="author">
    {{fit author w=821 h=64 max=46 min=31 lh=1.15 font=body lines=1}}
  </div>
  {{/if}}
</div>
