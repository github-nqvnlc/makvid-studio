<div class="region list">
  <div class="blobs" aria-hidden="true"></div>
  <div class="pane" aria-hidden="true"></div>
  <h2 class="list-title" data-qa="title">{{fit title w=1690 h=193 max=86 min=54 lh=1.12 font=display lines=2}}</h2>
  <ol class="items">{{#each items}}
    <li class="item" data-qa="item"><span class="bullet" style="width:86px">{{@num}}</span><span class="item-text">{{fit item w=1576 h=83 max=54 min=32 lh=1.25 font=body lines=2 group=items}}</span></li>{{/each}}
  </ol>
</div>
