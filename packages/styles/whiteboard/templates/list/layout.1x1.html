<div class="region list">
  <h2 class="list-title" data-qa="title">
    {{fit title w=928 h=184 max=82 min=54 lh=1.12 font=display lines=2}}
  </h2>
  <ol class="items">
    {{#each items}}
    <li class="item" data-qa="item">
      <span class="bullet" style="width: 86px">{{@num}}</span
      ><span class="item-text"
        >{{fit item w=814 h=87 max=54 min=33 lh=1.25 font=body lines=2 group=items}}</span
      >
    </li>
    {{/each}}
  </ol>
</div>
