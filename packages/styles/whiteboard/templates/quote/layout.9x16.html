<div class="region quote">
  <div class="qmark" aria-hidden="true">“</div>
  <blockquote class="q-text" data-qa="quote">
    {{fit quote w=795 h=686 max=100 min=51 lh=1.2 font=display lines=6}}
  </blockquote>
  {{#if author}}
  <div class="q-author" data-qa="author">
    {{fit author w=821 h=70 max=50 min=34 lh=1.15 font=body lines=1}}
  </div>
  {{/if}}
</div>
