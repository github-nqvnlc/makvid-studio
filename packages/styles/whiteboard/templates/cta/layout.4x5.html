<div class="region cta">
  <div class="deco" aria-hidden="true"></div>
  <h1 class="cta-head" data-qa="headline">
    {{fit headline w=826 h=414 max=110 min=61 lh=1.08 font=display lines=3}}
  </h1>
  <div class="cta-btn" data-qa="action">
    {{fit action w=780 h=78 max=60 min=34 lh=1.15 font=display lines=1}}
  </div>
  {{#if handle}}
  <div class="cta-handle" data-qa="handle">
    {{fit handle w=872 h=62 max=44 min=29 lh=1.15 font=body lines=1}}
  </div>
  {{/if}}
</div>
