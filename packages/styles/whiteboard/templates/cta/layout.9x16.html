<div class="region cta">
  <div class="deco" aria-hidden="true"></div>
  <h1 class="cta-head" data-qa="headline">
    {{fit headline w=778 h=515 max=124 min=68 lh=1.08 font=display lines=3}}
  </h1>
  <div class="cta-btn" data-qa="action">
    {{fit action w=734 h=88 max=68 min=40 lh=1.15 font=display lines=1}}
  </div>
  {{#if handle}}
  <div class="cta-handle" data-qa="handle">
    {{fit handle w=821 h=70 max=50 min=34 lh=1.15 font=body lines=1}}
  </div>
  {{/if}}
</div>
