openapi: 3.1.0
info:
  title: MakVid Studio Public API
  version: 1.0.0
  description: >
    Create Vietnamese videos from a prompt, a script, an article URL or a template, run batches from a CSV,
    follow progress and download the results. Authenticate with a workspace API key
    (`Authorization: Bearer mk_live_...`, created by an owner or admin in the app). Requests are rate-limited
    per key (60 per minute by default); a 429 answer carries `Retry-After` (seconds). POST requests accept an
    `Idempotency-Key` header: the same key with the same body replays the first answer instead of creating a
    second video. The API is available on paid plans.
servers:
  - url: https://{host}/api/v1
    variables:
      host: { default: app.example.com }
security:
  - apiKey: []
paths:
  /videos:
    post:
      summary: Create a video from prompt, script or URL
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVideoRequest" }
      responses:
        "202":
          description: Accepted
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /videos/{id}:
    get:
      summary: Get video status and outputs
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Video" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /videos/{id}/download:
    get:
      summary: Get signed download URLs (they expire after one hour)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: aspect, in: query, schema: { $ref: "#/components/schemas/Aspect" } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Download" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /templates/{id}/videos:
    post:
      summary: Create a video from a template with variables
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables:
                  type: object
                  additionalProperties: { type: [string, number] }
                  description: One value per template variable, e.g. {"ten_khach_hang":"Chị Hoà"}
                aspects: { type: array, items: { $ref: "#/components/schemas/Aspect" } }
      responses:
        "202":
          description: Accepted
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /batches:
    post:
      summary: Run a batch from a template and CSV (one video per row)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [templateId, file]
              properties:
                templateId: { type: string }
                file: { type: string, format: binary, description: "UTF-8 CSV; header row = variable names" }
      responses:
        "202":
          description: Accepted
          content: { application/json: { schema: { $ref: "#/components/schemas/Batch" } } }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /batches/{id}:
    get:
      summary: Batch progress
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Batch" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /batches/{id}/retry-failed:
    post:
      summary: Retry only failed rows
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [retried]
                properties: { retried: { type: integer, minimum: 0 } }
  /styles:
    get:
      summary: List style packs
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/StyleList" } } }
  /voices:
    get:
      summary: List voices
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VoiceList" } } }
webhooks:
  video.completed:
    post:
      summary: Sent when a video finishes (video.completed) or fails (video.failed), and when a batch completes
      description: >
        Verify `X-MakVid-Signature` (`t=<unix>,v1=<hex HMAC-SHA256(secret, "<t>.<raw body>")>`) with the endpoint
        secret shown when you created the endpoint, and reject timestamps older than 5 minutes. Failed deliveries
        are retried with exponential backoff (8 attempts). Answer with any 2xx status.
      parameters:
        - name: X-MakVid-Signature
          in: header
          required: true
          schema: { type: string }
          description: 't=<unix>,v1=<hex HMAC-SHA256 of "t.body">'
        - { name: X-MakVid-Event, in: header, schema: { type: string } }
        - { name: X-MakVid-Delivery, in: header, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookPayload" }
      responses:
        "2XX": { description: Acknowledged }
components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: "Workspace API key: mk_live_..." }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 255 } }
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    QuotaExceeded:
      description: Plan quota exceeded, or the feature is not in the plan
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationError:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Aspect: { type: string, enum: ["16:9", "9:16", "1:1", "4:5"] }
    CreateVideoRequest:
      type: object
      required: [source]
      properties:
        source:
          oneOf:
            - { type: object, required: [prompt], properties: { prompt: { type: string, maxLength: 4000 } } }
            - { type: object, required: [script], properties: { script: { type: string, maxLength: 20000 } } }
            - { type: object, required: [url], properties: { url: { type: string, format: uri } } }
        aspects: { type: array, items: { $ref: "#/components/schemas/Aspect" }, default: ["9:16"] }
        targetDurationSec: { type: integer, minimum: 30, maximum: 600 }
        styleId: { type: string }
        voiceId: { type: string }
        captions: { type: boolean, default: true }
    Job:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id: { type: string }
        status: { type: string, enum: [queued] }
    Video:
      type: object
      required: [id, status, progress, message, outputs]
      additionalProperties: false
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, processing, ready, needs_attention, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        message: { type: string }
        outputs:
          type: array
          items:
            type: object
            required: [aspect, durationMs]
            additionalProperties: false
            properties:
              aspect: { $ref: "#/components/schemas/Aspect" }
              durationMs: { type: integer }
    Download:
      type: object
      required: [mp4, expiresAt]
      additionalProperties: false
      properties:
        mp4: { type: string, format: uri }
        srt: { type: string, format: uri }
        thumbnail: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    Batch:
      type: object
      required: [id, status, total, succeeded, failed]
      additionalProperties: false
      properties:
        id: { type: string }
        status:
          type: string
          enum: [validating, queued, running, completed, completed_with_errors, paused_quota, cancelled]
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        zipUrl: { type: string, format: uri }
    StyleList:
      type: object
      required: [styles]
      properties:
        styles:
          type: array
          items:
            type: object
            required: [id, name, description]
            properties:
              id: { type: string }
              name: { type: object, required: [vi, en], properties: { vi: { type: string }, en: { type: string } } }
              description:
                { type: object, required: [vi, en], properties: { vi: { type: string }, en: { type: string } } }
    VoiceList:
      type: object
      required: [voices]
      properties:
        voices:
          type: array
          items:
            type: object
            required: [id, gender, tier, name, isDefault]
            properties:
              id: { type: string }
              gender: { type: string, enum: [female, male] }
              region: { type: [string, "null"], enum: [north, central, south, null] }
              tier: { type: string, enum: [standard, pro, ultra] }
              name: { type: string }
              isDefault: { type: boolean }
    WebhookPayload:
      type: object
      required: [event, status, message, createdAt]
      properties:
        event: { type: string, enum: [video.completed, video.failed, batch.completed] }
        videoId: { type: string }
        batchId: { type: string }
        status: { type: string }
        message: { type: string, description: User-friendly message (no technical detail) }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        hint: { type: string }
        reason: { type: string, description: "Quota denial reason (videos, video_seconds, api_disabled, ...)" }
