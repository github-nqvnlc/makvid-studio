# Full stack (T165): docker compose -f docker/compose.yml up -d --build   ->  http://localhost:3000
# Infra (postgres, valkey, seaweedfs, worker-align) + migrate (one shot) + web + the three stage workers.
# Secrets come from ../.env (copy .env.example and fill it in; see README). MAKVID_MOCK_PROVIDERS=1 runs the
# whole stack without paid calls.
#
# Hardening:
#   - Two networks. "internal" has no route to the internet: postgres, valkey, worker-align and worker-render
#     live only there, so compiled scenes (and the browser that renders them) cannot reach the network.
#     "edge" is for what needs the internet or the host: web (users), worker-ai / worker-audio (AI and voice
#     providers), seaweedfs (browsers download the signed URLs from it).
#   - Healthchecks on every long-running service, CPU/memory limits, restart policies, no dev default secrets.
#   - Render scales out: docker compose -f docker/compose.yml up -d --scale worker-render=3
#     (RENDER_DISTRIBUTED=1: a video's scenes are spread over every render container, ADR 0013).
name: makvid
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-makvid}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-makvid}
  VALKEY_URL: redis://valkey:6379
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-makvid}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
  S3_FORCE_PATH_STYLE: "true"
  ALIGN_URL: http://worker-align:8090
  WORK_ROOT: /work
  MAKVID_ROOT: /app
  MAKVID_MOCK_PROVIDERS: ${MAKVID_MOCK_PROVIDERS:-0}
  MAKVID_SECRET_KEY: ${MAKVID_SECRET_KEY:?set MAKVID_SECRET_KEY in .env}
  MAKVID_MEDIAGEN: ${MAKVID_MEDIAGEN:-off}
  APP_URL: ${APP_URL:-http://localhost:3000}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-mkv}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-worker: &worker
  build: { context: .., dockerfile: docker/worker-render.Dockerfile }
  image: makvid-worker:local
  working_dir: /app
  volumes: [work:/work]
  depends_on:
    migrate: { condition: service_completed_successfully }
    valkey: { condition: service_healthy }
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

networks:
  internal:
    internal: true
  edge: {}

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makvid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-makvid}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makvid}"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { cpus: "2", memory: 1g } } }
    restart: unless-stopped
    logging: *logging

  valkey:
    image: valkey/valkey:8.1.11-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [valkeydata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
    restart: unless-stopped
    logging: *logging

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # The S3 identity is written from .env at start (no credentials baked into the repo or image).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"makvid","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec /entrypoint.sh server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports: ["${S3_PORT:-8333}:8333"] # browsers download the signed URLs from here
    volumes: [seaweeddata:/data]
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 10s
      retries: 30
    deploy: { resources: { limits: { cpus: "2", memory: 1g } } }
    restart: unless-stopped
    logging: *logging

  worker-align:
    build: { context: .., dockerfile: docker/worker-align.Dockerfile }
    image: makvid-align:dev
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)",
        ]
      interval: 15s
      retries: 20
    deploy: { resources: { limits: { cpus: "${ALIGN_CPUS:-2}", memory: "${ALIGN_MEMORY:-3g}" } } }
    restart: unless-stopped
    logging: *logging

  # Daily database backup (T166): dumps in ./backups on the host, kept BACKUP_KEEP_DAYS days.
  # Restore test: docker compose run --rm backup /backup/restore-test.sh
  backup:
    image: postgres:17.11-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-makvid}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-makvid}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup:/backup:ro
      - ${BACKUP_DIR:-../backups}:/backups
    networks: [internal]
    entrypoint: ["/bin/sh", "-c"]
    command:
      ["while true; do /backup/backup.sh || echo 'backup failed'; sleep ${BACKUP_EVERY_SECONDS:-86400}; done"]
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *worker
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment: *app-env
    networks: [internal]
    entrypoint: ["node", "--import", "tsx", "packages/db/scripts/migrate.ts"]

  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    image: makvid-web:local
    ports: ["${WEB_PORT:-3000}:3000"]
    volumes: [work:/work]
    networks: [internal, edge]
    environment:
      <<: *app-env
      # Server-side reads/writes go over the internal network; signed URLs use the browser-reachable host.
      S3_ENDPOINT: "http://seaweedfs:8333"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAKVID_PAYMENTS: ${MAKVID_PAYMENTS:-off}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_SERVER: ${POLAR_SERVER:-production}
      POLAR_PRODUCT_CREDITS_MIN30: ${POLAR_PRODUCT_CREDITS_MIN30:-}
      POLAR_PRODUCT_CREDITS_MIN120: ${POLAR_PRODUCT_CREDITS_MIN120:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      start_period: 60s
      retries: 5
    deploy: { resources: { limits: { cpus: "2", memory: 2g } } }
    restart: unless-stopped
    logging: *logging

  worker-ai:
    <<: *worker
    networks: [internal, edge]
    environment:
      <<: *app-env
      S3_ENDPOINT: "http://seaweedfs:8333"
      FPT_AI_API_KEY: ${FPT_AI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SHOPAIKEY_API_KEY: ${SHOPAIKEY_API_KEY:-}
    entrypoint: ["node", "--import", "tsx", "apps/worker-ai/src/index.ts"]
    deploy: { resources: { limits: { cpus: "1", memory: 1g } } }

  worker-audio:
    <<: *worker
    networks: [internal, edge]
    environment:
      <<: *app-env
      S3_ENDPOINT: "http://seaweedfs:8333"
      FPT_AI_API_KEY: ${FPT_AI_API_KEY:-}
      SOUNDSTRIPE_API_KEY: ${SOUNDSTRIPE_API_KEY:-}
    entrypoint: ["node", "--import", "tsx", "apps/worker-audio/src/index.ts"]
    deploy: { resources: { limits: { cpus: "2", memory: 2g } } }

  worker-render:
    <<: *worker
    # No internet: scenes are self-contained (fonts, scripts, images are bundled at compile time).
    networks: [internal]
    shm_size: 2g
    environment:
      <<: *app-env
      S3_ENDPOINT: "http://seaweedfs:8333"
      RENDER_WORKERS: ${RENDER_WORKERS:-4}
      RENDER_DISTRIBUTED: "1"
    entrypoint: ["node", "--import", "tsx", "apps/worker-render/src/index.ts"]
    # ADR 0003 baseline is 8 vCPU / 16 GB per render worker; defaults fit a Docker Desktop laptop.
    deploy: { resources: { limits: { cpus: "${RENDER_CPUS:-4}", memory: "${RENDER_MEMORY:-4g}" } } }

volumes:
  pgdata:
  valkeydata:
  seaweeddata:
  work:
